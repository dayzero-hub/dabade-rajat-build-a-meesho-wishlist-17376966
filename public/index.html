<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meesho Wishlist</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
  .card { position: relative; border: 1px solid #ddd; border-radius: 8px; padding: 0.75rem; text-align: center; }
  .card.saved { border-color: #e63946; background: #fff5f5; }
  .card img { width: 100%; border-radius: 4px; }
  .price { font-weight: bold; color: #333; }
  .heart { position: absolute; top: 0.5rem; right: 0.5rem; border: none; background: none; font-size: 1.4rem; cursor: pointer; color: #bbb; }
  .heart.active { color: #e63946; }
  .heart:disabled { cursor: default; opacity: 0.5; }
  .empty { color: #777; }
  .status { color: #b00020; }
</style>
</head>
<body>
<h1>Products</h1>
<div class="grid" id="products"></div>

<h1>Wishlist</h1>
<div class="grid" id="wishlist"></div>
<p class="status" id="status"></p>

<script src="app.js"></script>
</body>
</html>
